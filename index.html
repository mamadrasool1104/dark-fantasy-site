<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>عمو رسول</title>

  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-0:#0b0f14; --bg-1:#101722; --ink:#eaf2ff; --muted:#a9b3c7;
      --glass:rgba(255,255,255,.06); --glass-stroke:rgba(255,255,255,.12);
      --primary:#8ab4ff; --accent:#ff6ad5; --lime:#9aff6a; --cyan:#6afff3;
      --radius:20px;
      --shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1200px 700px at 70% -10%, #1b2230 0%, transparent 60%),
        radial-gradient(900px 600px at 10% 110%, #131b26 0%, transparent 60%),
        linear-gradient(180deg, #0a0f14 0%, #0a0f14 100%);
      color:var(--ink);
      font-family:'Vazirmatn',system-ui;
      overflow-x:hidden;
    }

    canvas#stars{
      position:fixed;
      inset:0;
      z-index:-2;
      filter:drop-shadow(0 0 4px rgba(255,255,255,.35))
    }

    .blob{
      position:fixed;
      width:38vmax;height:38vmax;border-radius:50%;
      background:radial-gradient(circle at 30% 30%,
        rgba(154,255,106,.25),
        rgba(138,180,255,.25) 40%,
        rgba(0,0,0,0) 60%);
      mix-blend-mode:screen;
      filter:blur(42px);
      z-index:-1;
      animation:float 16s ease-in-out infinite;
    }
    .blob.b1{right:-10vmax;top:-8vmax}
    .blob.b2{left:-12vmax;top:12vmax;animation-duration:22s}

    @keyframes float{
      0%,100%{transform:translate(0,0) scale(1)}
      50%{transform:translate(3vmax,-2vmax) scale(1.07)}
    }

    header{text-align:center;padding:40px 20px}
    .brand{
      display:inline-flex;
      align-items:center;
      gap:14px;
      padding:10px 16px;
      border-radius:999px;
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
      border:1px solid var(--glass-stroke);
      box-shadow:var(--shadow);
    }
    .orb{
      width:14px;height:14px;border-radius:50%;
      background:radial-gradient(circle at 30% 30%, var(--lime), #47c74a);
      animation:pulse 1.6s infinite;
      box-shadow:0 0 18px var(--lime),0 0 36px rgba(154,255,106,.45);
    }
    @keyframes pulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.18)}
    }

    h1{
      margin:16px 0 0;
      font-family:'Lalezar',cursive;
      font-size:clamp(40px,8vw,92px);
      text-shadow:
        0 0 10px rgba(154,255,106,.25),
        0 0 24px rgba(138,180,255,.35),
        0 0 40px rgba(255,106,213,.2);
    }

    main{max-width:1180px;margin:26px auto 90px;padding:0 22px}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}

    .card{
      grid-column:span 6;
      padding:22px;
      border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
      border:1px solid var(--glass-stroke);
      box-shadow:var(--shadow);
      transition:transform .2s ease;
    }
    @media(max-width:1000px){.card{grid-column:span 12}}

    .channel-card{
      display:grid;
      grid-template-columns:96px 1fr;
      gap:16px;
      align-items:center;
      margin-bottom:16px;
    }
    .channel-avatar{
      width:96px;height:96px;border-radius:50%;
      background:radial-gradient(circle at 30% 30%, rgba(154,255,106,.8), rgba(106,255,243,.6));
      box-shadow:0 0 16px rgba(154,255,106,.25);
    }
    .channel-meta{display:flex;flex-direction:column;gap:6px}
    .channel-title{font-weight:900}
    .channel-desc{color:var(--muted);font-size:14px}

    .btn{
      margin-top:6px;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.22);
      background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
      color:var(--ink);
      text-decoration:none;
      font-size:13px;
      width:max-content;
    }

    .my-text p{
      line-height:1.9;
      font-size:16px;
      margin:0 0 14px;
    }

    footer{
      text-align:center;
      color:var(--muted);
      padding:60px 20px 30px;
      font-size:14px;
    }
  </style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="blob b1"></div>
<div class="blob b2"></div>

<header>
  <div class="brand"><span class="orb"></span></div>
  <h1>عمو رسول</h1>
</header>

<main>

<section class="grid">
  <div class="card">
    <h3>⚜️ کانال‌های تلگرام ⚜️</h3>
    <div id="tg-container"></div>
  </div>

  <div class="card">
    <h3>⚜️ کانال‌های ایتا ⚜️</h3>
    <div id="ei-container"></div>
  </div>
</section>

<!-- 💬 حرف‌های من -->
<section class="grid" style="margin-top:18px;">
  <div class="card" style="grid-column:span 12">
    <h3>💬 حرف‌های من</h3>

    <!-- فقط خودت این بخش رو ویرایش می‌کنی -->
    <div class="my-text">
      <p>سلام رفقا 🌱</p>
      <p>اینجا هر از گاهی حرف دلمو باهاتون درمیون می‌ذارم.</p>
      <p>اگه دوست داشتید، هر وقت سر بزنید شاید یه متن جدید اینجا باشه ✨</p>
      <p class="muted">آخرین بروزرسانی: ۱۴۰۳/۰۹/۰۶</p>
    </div>

  </div>
</section>

</main>

<footer>
▂▃▅▇ ساخته شده توسط عمو رسول ▇▅▃▂
</footer>

<script>
  // Starfield
  const canvas=document.getElementById('stars');
  const ctx=canvas.getContext('2d');
  let w,h,stars;
  function resize(){
    w=canvas.width=innerWidth;
    h=canvas.height=innerHeight;
    stars=Array.from({length:170},()=>({
      x:Math.random()*w,y:Math.random()*h,
      vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,
      r:Math.random()*1.4+.3
    }));
  }
  function step(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.x+=s.vx; s.y+=s.vy;
      if(s.x<0)s.x=w;if(s.x>w)s.x=0;
      if(s.y<0)s.y=h;if(s.y>h)s.y=0;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(220,240,255,.8)';
      ctx.fill();
    }
    requestAnimationFrame(step);
  }
  addEventListener('resize',resize); resize(); step();

  const CHANNELS=[
    {platform:'Telegram',title:'عمو رسول',url:'https://t.me/amoo_rasool',desc:'کانال شخصی عمو😉😂', image:'./assets/img/tg_amo_rasool.png'},
    {platform:'Telegram',title:'نور صنعت',url:'https://t.me/nour_sanat',desc:'خبرها و نکات فنی صنعت', image:'./assets/img/tg_nour_sanat.png'},
    {platform:'Eitaa',title:'تک‌ نور',url:'https://eitaa.com/Tech_nour',desc:'هوش مصنوعی و تکنولوژی 🤖', image:'./assets/img/ei_tech_nour.png'},
    {platform:'Eitaa',title:'اوای خیال',url:'https://eitaa.com/avay_khiyal',desc:'متن‌های احساسی 🌙', image:'./assets/img/ei-avay-khiyal.png'},
  ];

  function channelCard(c){
    const d=document.createElement('div');
    d.className='channel-card';
    d.innerHTML=`
      <div class="channel-avatar"><img href="${c.image}"></div>
      <div class="channel-meta">
        <div class="channel-title">${c.title}</div>
        <div class="channel-desc">${c.desc}</div>
        <a class="btn" href="${c.url}" target="_blank">مشاهده کانال</a>
      </div>`;
    return d;
  }

  CHANNELS.forEach(c=>{
    (c.platform==='Telegram'
      ?document.getElementById('tg-container')
      :document.getElementById('ei-container')
    ).appendChild(channelCard(c));
  });
</script>

</body>
</html>
